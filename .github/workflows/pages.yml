name: Deploy public website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
      - name: Check published files
        run: |
          test -f site/fr/index.html
          test -f site/ar/index.html
          test -f site/en/index.html
          test -f site/images/logo.webp
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
          include-hidden-files: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
